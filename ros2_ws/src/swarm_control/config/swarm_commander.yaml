# Parameters for the swarm_commander node.
# Fence + min_separation: config/swarm_limits.yaml (shared with swarm_telemetry).
# The drone list is read from crazyflies_yaml_file (set by the launch file).
swarm_commander:
  ros__parameters:
    world_frame: world
    state_rate: 10.0          # Hz for /swarm/commander_state

    fence_mode: clamp         # clamp = move target inside, reject = refuse command
    max_speed: 0.5            # m/s, used to stretch durations
    min_duration: 1.0         # s
    sync_group: true          # all drones in one command arrive together

    takeoff_height: 0.5
    takeoff_duration: 2.0
    land_duration: 2.0
    default_spacing: 0.6      # m, formations

    health_gating: true       # refuse takeoff/moves for faulted drones (needs swarm_telemetry)
